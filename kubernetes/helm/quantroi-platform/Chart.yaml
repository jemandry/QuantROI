apiVersion: v2
name: quantroi-platform
description: Ethical AI-Driven Fintech Trading Platform with Causal AI and Dual ZKP
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - fintech
  - trading
  - causal-ai
  - zkp
  - kubernetes
home: https://github.com/Synergy-Cloud-System-LlLC/quantroi
sources:
  - https://github.com/Synergy-Cloud-System-LlLC/quantroi
maintainers:
  - name: QuantROI Team
    email: team@quantroi.com
dependencies:
  - name: redis
    version: "17.3.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "20.0.6"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: postgresql
    version: "12.1.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: prometheus
    version: "15.18.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.50.7"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled
annotations:
  category: Financial Technology
  licenses: MIT
