version: '3.8'

services:
  vix-regime-detection:
    build:
      context: .
      dockerfile: Dockerfile.vix-regime
    image: quantroi/vix-regime-detection:latest
    container_name: quantroi-vix-regime
    ports:
      - "8005:8005"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - GPU_ACCELERATION_ENABLED=true
      - SABR_CALIBRATION_GPU=true
      - MONTE_CARLO_GPU_PATHS=100000
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - neo4j
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  real-time-trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    image: quantroi/real-time-trainer:latest
    container_name: quantroi-trainer
    ports:
      - "8006:8006"
    environment:
      - TRAINING_MODE=real-time
      - GPU_ENABLED=true
      - BATCH_SIZE=1024
      - LEARNING_RATE=0.001
      - DATA_SOURCE_URL=wss://stream.binance.com:9443/ws/btcusdt@ticker
    volumes:
      - training_data:/data
      - ./enhanced-ria-features/training:/app/training
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: quantroi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15
    container_name: quantroi-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/quantroi123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: quantroi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: quantroi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=quantroi123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: quantroi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - vix-regime-detection
      - real-time-trainer
    restart: unless-stopped

volumes:
  training_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: quantroi-network
    driver: bridge
