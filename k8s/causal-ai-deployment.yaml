apiVersion: apps/v1
kind: Deployment
metadata:
  name: causal-ai-engine
  namespace: quantroi
  labels:
    app: causal-ai-engine
    tier: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: causal-ai-engine
  template:
    metadata:
      labels:
        app: causal-ai-engine
        tier: ai
    spec:
      containers:
      - name: causal-ai-engine
        image: quantroi/causal-ai-engine:latest
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: quantroi-config
        - secretRef:
            name: quantroi-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            nvidia.com/gpu: 1
          limits:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: causal-ai-service
  namespace: quantroi
spec:
  selector:
    app: causal-ai-engine
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
