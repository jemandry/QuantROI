apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-orchestrator
  namespace: quantroi
  labels:
    app: main-orchestrator
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: main-orchestrator
  template:
    metadata:
      labels:
        app: main-orchestrator
        tier: backend
    spec:
      containers:
      - name: main-orchestrator
        image: quantroi/main-orchestrator:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: quantroi-config
        - secretRef:
            name: quantroi-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: main-orchestrator-service
  namespace: quantroi
spec:
  selector:
    app: main-orchestrator
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
