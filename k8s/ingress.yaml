apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantroi-ingress
  namespace: quantroi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api.quantroi.com
    - app.quantroi.com
    secretName: quantroi-tls
  rules:
  - host: api.quantroi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: main-orchestrator-service
            port:
              number: 8000
      - path: /causal-ai
        pathType: Prefix
        backend:
          service:
            name: causal-ai-service
            port:
              number: 8001
      - path: /compliance
        pathType: Prefix
        backend:
          service:
            name: compliance-service
            port:
              number: 8002
  - host: app.quantroi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
