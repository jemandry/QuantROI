apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantroi-gpu-accelerated
  namespace: quantroi
  labels:
    app: quantroi-gpu
    platform: io-net
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantroi-gpu
  template:
    metadata:
      labels:
        app: quantroi-gpu
        platform: io-net
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
        provider: io-net
      containers:
      - name: vix-regime-detection
        image: quantroi/vix-regime-detection:latest
        ports:
        - containerPort: 8005
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "max_split_size_mb:512"
        - name: GPU_ACCELERATION_ENABLED
          value: "true"
        - name: SABR_CALIBRATION_GPU
          value: "true"
        - name: MONTE_CARLO_GPU_PATHS
          value: "100000"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: NEO4J_URI
          value: "bolt://neo4j-service:7687"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 15
      - name: real-time-data-trainer
        image: quantroi/real-time-trainer:latest
        ports:
        - containerPort: 8006
        env:
        - name: TRAINING_MODE
          value: "real-time"
        - name: GPU_ENABLED
          value: "true"
        - name: BATCH_SIZE
          value: "1024"
        - name: LEARNING_RATE
          value: "0.001"
        - name: DATA_SOURCE_URL
          value: "wss://stream.binance.com:9443/ws/btcusdt@ticker"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: NEO4J_URI
          value: "bolt://neo4j-service:7687"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: 8006
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: training-data
          mountPath: /data
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: quantroi-training-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quantroi-gpu-service
  namespace: quantroi
spec:
  selector:
    app: quantroi-gpu
  ports:
  - name: vix-regime
    protocol: TCP
    port: 8005
    targetPort: 8005
  - name: real-time-trainer
    protocol: TCP
    port: 8006
    targetPort: 8006
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quantroi-training-pvc
  namespace: quantroi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quantroi-gpu-hpa
  namespace: quantroi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quantroi-gpu-accelerated
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
