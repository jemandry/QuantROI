apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pearl-ladder.fullname" . }}-ladder-escalator
  labels:
    {{- include "pearl-ladder.labels" . | nindent 4 }}
    app.kubernetes.io/component: ladder-escalator
spec:
  {{- if not .Values.ladderEscalator.autoscaling.enabled }}
  replicas: {{ .Values.ladderEscalator.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pearl-ladder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ladder-escalator
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "pearl-ladder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ladder-escalator
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pearl-ladder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ladder-escalator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.ladderEscalator.image.repository }}:{{ .Values.ladderEscalator.image.tag }}"
          imagePullPolicy: {{ .Values.ladderEscalator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ladderEscalator.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: SERVICE_NAME
              value: "ladder-escalator"
            - name: SERVICE_PORT
              value: "{{ .Values.ladderEscalator.service.targetPort }}"
            - name: PERFORMANCE_TARGET_RUNG1
              value: "50000"  # 50μs in nanoseconds
            - name: PERFORMANCE_TARGET_RUNG2
              value: "500000000"  # 500ms in nanoseconds
            - name: PERFORMANCE_TARGET_RUNG3
              value: "10000000000"  # 10s in nanoseconds
            - name: REDIS_HOST
              value: "{{ .Values.dependencies.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.dependencies.redis.port }}"
            - name: NEO4J_HOST
              value: "{{ .Values.dependencies.neo4j.host }}"
            - name: NEO4J_PORT
              value: "{{ .Values.dependencies.neo4j.port }}"
          resources:
            {{- toYaml .Values.ladderEscalator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
