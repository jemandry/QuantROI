events {
    worker_connections 1024;
}

http {
    upstream vix_regime_backend {
        server vix-regime-detection:8005;
    }
    
    upstream trainer_backend {
        server real-time-trainer:8006;
    }
    
    server {
        listen 80;
        server_name quantroi.io.net;
        
        location /api/vix/ {
            proxy_pass http://vix_regime_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /api/trainer/ {
            proxy_pass http://trainer_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
