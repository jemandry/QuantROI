[package]
name = "quantroi-apis"
version = "0.1.0"
description = "High-performance API services for QuantROI platform"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.6"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
solana-client = "1.14"
solana-sdk = "1.14"
sha3 = "0.10.8"
reqwest = { version = "0.11", features = ["json"] }
