[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantroi-braided-cord-data-engine"
version = "0.1.0"
description = "High-performance Braided Cord Data Engine with scientific rigor frameworks"
authors = [
    {name = "QuantROI Team", email = "team@quantroi.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "redis>=4.0.0",
    "asyncio-mqtt>=0.11.0",
    "hashlib2>=1.0.0",
    "causalnex>=0.12.0",
    "dowhy>=0.9.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.9.0",
    "networkx>=2.8.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.10.0",
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0",
    "pydantic>=1.10.0",
    "sqlalchemy>=1.4.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.14.0",
    "structlog>=22.1.0",
    "cryptography>=37.0.0",
    "web3>=6.0.0",
    "solana>=0.30.0",
    "anchor-client>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.19.0",
    "pytest-benchmark>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.971",
    "coverage>=6.4.0",
    "pre-commit>=2.20.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.19.0",
    "pytest-benchmark>=4.0.0",
    "coverage>=6.4.0",
]

[tool.setuptools.packages.find]
where = ["ai-models"]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
