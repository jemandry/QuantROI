name: Predictive Compliance AI CI/CD

on:
  push:
    paths:
      - 'ai-models/src/predictive_compliance_engine.py'
      - 'ai-models/src/sec_rss_monitor.py'
      - 'ai-models/src/nats_optimization.py'
      - 'ai-models/src/grok_voice_interface.py'
      - 'ai-models/tests/test_predictive_compliance_engine.py'
  pull_request:
    paths:
      - 'ai-models/src/predictive_compliance_engine.py'
      - 'ai-models/src/sec_rss_monitor.py'
      - 'ai-models/tests/test_predictive_compliance_engine.py'

jobs:
  compliance-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd ai-models
        pip install -r requirements.txt
        
    - name: Run compliance tests
      run: |
        cd ai-models
        python -m pytest tests/test_predictive_compliance_engine.py -v
        
    - name: Test SEC RSS monitoring
      run: |
        cd ai-models/src
        python sec_rss_monitor.py --test-mode
        
    - name: Test NATS optimization
      run: |
        cd ai-models/src
        python nats_optimization.py
        
    - name: Test voice interface
      run: |
        cd ai-models/src
        python grok_voice_interface.py --test-mode
        
    - name: Verify Rust compilation
      run: |
        cd memory-hierarchy
        cargo check
        
    - name: Test Python imports
      run: |
        cd ai-models
        python -c "from src.predictive_compliance_engine import PredictiveComplianceEngine; print('✓ Compliance engine import successful')"
        python -c "from src.sec_rss_monitor import SECRSSMonitor; print('✓ SEC RSS monitor import successful')"
        python -c "from src.nats_optimization import NATSOptimizer; print('✓ NATS optimizer import successful')"
        python -c "from src.grok_voice_interface import GrokVoiceInterface; print('✓ Voice interface import successful')"
        
    - name: Run performance integration tests
      run: |
        cd ai-models
        python test_performance_audit_integration.py
        
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      with:
        name: compliance-test-results
        path: |
          ai-models/test-results/
          ai-models/logs/
      if: always()

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r ai-models/src/predictive_compliance_engine.py ai-models/src/sec_rss_monitor.py -f json -o security-report.json || true
        
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: security-report.json
      if: always()

  deployment-validation:
    runs-on: ubuntu-latest
    needs: [compliance-tests, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Validate Kubernetes manifests
      run: |
        # Install kubeval for manifest validation
        wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
        tar xf kubeval-linux-amd64.tar.gz
        sudo mv kubeval /usr/local/bin
        
        # Validate deployment manifests
        kubeval deployment/enhanced_deployment_config.yaml
        kubeval infrastructure/unified-api-deployment.yaml
        
    - name: Test Docker build
      run: |
        # Create minimal Dockerfile for testing
        cat > Dockerfile.test << EOF
        FROM python:3.10-slim
        WORKDIR /app
        COPY ai-models/requirements.txt .
        RUN pip install -r requirements.txt
        COPY ai-models/src/ ./src/
        CMD ["python", "-c", "from src.predictive_compliance_engine import PredictiveComplianceEngine; print('Docker build successful')"]
        EOF
        
        docker build -f Dockerfile.test -t compliance-test .
        docker run --rm compliance-test
