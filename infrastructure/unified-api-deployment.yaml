apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-api-server
  namespace: quantroi-production
  labels:
    app: unified-api-server
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unified-api-server
  template:
    metadata:
      labels:
        app: unified-api-server
        version: v2.0.0
    spec:
      containers:
      - name: unified-api
        image: quantroi/unified-api:v2.0.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_CLUSTER_NODES
          value: "redis-cluster:6379"
        - name: MIN_NODES
          value: "3"
        - name: MAX_NODES
          value: "50"
        - name: TARGET_CPU_UTILIZATION
          value: "70"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: unified-api-config
      - name: logs
        emptyDir: {}
      serviceAccountName: unified-api-service-account
---
apiVersion: v1
kind: Service
metadata:
  name: unified-api-service
  namespace: quantroi-production
  labels:
    app: unified-api-server
spec:
  selector:
    app: unified-api-server
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unified-api-config
  namespace: quantroi-production
data:
  config.json: |
    {
      "min_nodes": 3,
      "max_nodes": 50,
      "target_cpu_utilization": 70,
      "redis_cluster_nodes": ["redis-cluster:6379"],
      "monitoring": {
        "max_cpu_percent": 80.0,
        "max_memory_percent": 85.0,
        "max_response_time_ms": 1000.0,
        "min_throughput_rps": 1000.0
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unified-api-service-account
  namespace: quantroi-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unified-api-cluster-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unified-api-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: unified-api-cluster-role
subjects:
- kind: ServiceAccount
  name: unified-api-service-account
  namespace: quantroi-production
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-api-ingress
  namespace: quantroi-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api.quantroi.com
    secretName: quantroi-tls-secret
  rules:
  - host: api.quantroi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: unified-api-service
            port:
              number: 80
