[package]
name = "memory-hierarchy"
version = "0.1.0"
edition = "2021"
description = "Memory hierarchy implementation demonstrating order of information in computing systems"
authors = ["Devin AI <devin-ai-integration[bot]@users.noreply.github.com>"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "memory_hierarchy_bench"
harness = false
