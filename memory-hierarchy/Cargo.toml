[package]
name = "memory-hierarchy"
version = "0.1.0"
edition = "2021"
description = "Memory hierarchy implementation demonstrating order of information in computing systems"
authors = ["Devin AI <devin-ai-integration[bot]@users.noreply.github.com>"]

[[bin]]
name = "memory-hierarchy-service"
path = "src/service.rs"

[[bin]]
name = "braided-brownian-processor"
path = "src/braided_processor.rs"

[[bin]]
name = "memory-hierarchy-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1.74"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "aio"] }
sqlx = { version = "0.7.3", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
nalgebra = "0.32"
statrs = "0.16"
uuid = { version = "1.0", features = ["v4", "serde"] }

# WASM runtime dependencies (optional, for production use)
# wasmtime = { version = "15.0", optional = true }
# wasmer = { version = "4.2", optional = true }

# Additional ML and NLP dependencies (optional, for production use)
# candle-core = { version = "0.3", optional = true }
# tokenizers = { version = "0.15", optional = true }

# Compliance and reporting (optional, for production use)
# pdf-writer = { version = "0.9", optional = true }
# html2pdf = { version = "0.5", optional = true }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
zstd = "0.13"
lz4 = "1.24"
reqwest = { version = "0.11", features = ["json"] }
# rdkafka = { version = "0.36", features = ["cmake-build"], optional = true } # Disabled due to cmake dependency
prometheus = "0.13"
hyper = { version = "1.0", features = ["full"] }
memmap2 = "0.9"
rand_chacha = "0.3"
rand_distr = "0.4"
sha2 = "0.10"
sha3 = "0.10"
rayon = "1.8"
lru = "0.12"
bincode = "1.3"
flate2 = "1.0"
num_cpus = "1.16"
base64 = "0.21"

[features]
default = ["quantum-simulation"]
quantum-simulation = []
quantum-hardware = ["quantum-simulation"]
solana-integration = []

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"

[[bench]]
name = "memory_hierarchy_bench"
harness = false
