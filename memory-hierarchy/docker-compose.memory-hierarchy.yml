
services:
  memory-hierarchy-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=fintech_platform
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=INFO
      - RUST_LOG=info
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - timescaledb
      - kafka
    volumes:
      - ./logs:/app/logs
      - memory_hierarchy_data:/app/data
    networks:
      - quantroi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8'
        reservations:
          memory: 8G
          cpus: '4'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  braided-brownian-processor:
    build:
      context: .
      dockerfile: Dockerfile.braided
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - KAFKA_BROKERS=kafka:9092
      - GPU_ENABLED=true
      - QUANTIZATION_LEVEL=INT8
      - PRUNING_SPARSITY=0.4
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - timescaledb
      - kafka
      - memory-hierarchy-service
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - braided_models_data:/app/braided_data
    networks:
      - quantroi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '16'
        reservations:
          memory: 16G
          cpus: '8'
    runtime: nvidia
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_memory_hierarchy:/data
    networks:
      - quantroi-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    sysctls:
      - net.core.somaxconn=65535
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '4'
        reservations:
          memory: 8G
          cpus: '2'

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=fintech_platform
      - POSTGRES_USER=platform_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_SHARED_PRELOAD_LIBRARIES=timescaledb
    ports:
      - "5432:5432"
    volumes:
      - timescale_memory_hierarchy:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - quantroi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8'
        reservations:
          memory: 8G
          cpus: '4'
    command: postgres -c shared_preload_libraries=timescaledb -c max_connections=200 -c shared_buffers=4GB -c effective_cache_size=12GB

  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    volumes:
      - kafka_memory_hierarchy:/var/lib/kafka/data
    networks:
      - quantroi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_memory_hierarchy:/var/lib/zookeeper
    networks:
      - quantroi-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - quantroi-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - quantroi-network
    restart: unless-stopped
    depends_on:
      - prometheus

  anchor-cli-service:
    build:
      context: .
      dockerfile: Dockerfile.anchor
    environment:
      - SOLANA_RPC_URL=http://solana-test-validator:8899
      - ANCHOR_PROVIDER_URL=http://solana-test-validator:8899
      - ANCHOR_WALLET=/app/.anchor/test-ledger/faucet-keypair.json
    volumes:
      - ../solana-contracts:/app/contracts
      - anchor_build_cache:/app/target
      - anchor_node_modules:/app/node_modules
    networks:
      - quantroi-network
    restart: unless-stopped
    depends_on:
      - solana-test-validator
      - memory-hierarchy-service
    command: ["tail", "-f", "/dev/null"]

  solana-test-validator:
    image: solanalabs/solana:v1.18.22
    ports:
      - "8899:8899"
      - "8900:8900"
    volumes:
      - solana_test_ledger:/app/test-ledger
    networks:
      - quantroi-network
    restart: unless-stopped
    command: [
      "solana-test-validator",
      "--ledger", "/app/test-ledger",
      "--bind-address", "0.0.0.0",
      "--rpc-port", "8899",
      "--faucet-port", "8900",
      "--reset"
    ]

  mina-zkapp-service:
    build:
      context: ../mina-zkapp
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MINA_ENDPOINT=https://proxy.berkeley.minaexplorer.com/graphql
      - ARCHIVE_ENDPOINT=https://archive.berkeley.minaexplorer.com
    networks:
      - quantroi-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  zkp-audit-router:
    build:
      context: ../ai-models
      dockerfile: Dockerfile.zkp-router
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=development
      - SOLANA_RPC_URL=http://solana-test-validator:8899
      - MINA_ZKAPP_SERVICE_URL=http://mina-zkapp-service:3001
    depends_on:
      - mina-zkapp-service
      - solana-test-validator
    networks:
      - quantroi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  memory_hierarchy_data:
  braided_models_data:
  redis_memory_hierarchy:
  timescale_memory_hierarchy:
  kafka_memory_hierarchy:
  zookeeper_memory_hierarchy:
  prometheus_data:
  grafana_data:
  anchor_build_cache:
  anchor_node_modules:
  solana_test_ledger:

networks:
  quantroi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
