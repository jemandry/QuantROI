[package]
name = "ai-competition"
version = "0.1.0"
description = "AI agent competition, ROI tracking, voting, and goal management smart contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ai_competition"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
spl-token = "4.0.0"
spl-memo = "4.0.0"
solana-program = "1.16.0"
sha3 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "bigdecimal"] }
tokio = { version = "1.0", features = ["full"] }
bigdecimal = "0.3"
