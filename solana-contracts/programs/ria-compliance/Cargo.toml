[package]
name = "ria-compliance"
version = "0.1.0"
description = "RIA compliance and digital contract signing smart contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ria_compliance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.28.0", features = ["init-if-needed"] }
anchor-spl = "0.28.0"
spl-token = "4.0.0"
spl-memo = "4.0.0"
solana-program = "1.16.0"
sha3 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
